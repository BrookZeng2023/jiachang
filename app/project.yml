name: jiachang
options:
  bundleIdPrefix: io.github.BrookZeng2023
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
targets:
  jiachang:
    type: application
    platform: iOS
    sources:
      - path: jiachang
        excludes:
          - Resources/Catalog/**
      - path: jiachang/Resources/Catalog
        type: folder
        buildPhase: resources
      - path: jiachang/Resources/Fonts
        type: folder
        buildPhase: resources
    info:
      path: jiachang/Info.plist
      properties:
        CFBundleDisplayName: 家常
        CFBundleShortVersionString: "0.6.0"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [zh-Hans, en]
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: 拍下这道菜的照片，只保存在家常里 · Take a photo of this dish; it stays inside Jiachang
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        # Overridden by scripts/release.sh with the git commit count.
        CURRENT_PROJECT_VERSION: 1
  jiachangUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: jiachangUITests
    dependencies:
      - target: jiachang
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  jiachangTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: jiachangTests
    dependencies:
      - target: jiachang
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
